onboarding = false
# herdr configuration
# Migrated from ~/.tmux.conf -- see notes inline for the tmux equivalent.
# Print all defaults with `herdr --default-config`.
# Apply changes to a running server with `herdr server reload-config`.

[theme]
# NOTE: deliberately NOT "nord". The terminal itself is themed nord, and
# doubling it makes some herdr UI elements invisible.
name = "nord"
auto_switch = false

[terminal]
# tmux: set -g default-command 'zsh'
# Empty means $SHELL, which is already zsh.
# tmux: split-window -c '#{pane_current_path}' -- "follow" is the default.
new_cwd = "follow"

[keys]
# tmux: unbind C-b; set -g prefix C-Space
prefix = "ctrl+space"

# Pane navigation.
# prefix+h/j/k/l are herdr's defaults and stay as a fallback.
# The direct ctrl+h/j/k/l chords are bound further down to the
# vim-herdr-navigation plugin, which replaces vim-tmux-navigator.
# tmux: bind -n M-Left/Right/Up/Down select-pane
focus_pane_left = ["prefix+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+right"]

# Tabs (tmux windows).
# tmux: bind -n S-Left previous-window / S-Right next-window
#       bind -n M-H previous-window / M-L next-window
previous_tab = ["prefix+p", "shift+left", "alt+shift+h"]
next_tab = ["prefix+n", "shift+right", "alt+shift+l"]

# vim-tmux-navigator replacement.
# Hands ctrl+h/j/k/l to vim when vim owns the focused pane, otherwise moves
# herdr's pane focus. Mirrors tmux's `if -F "#{@pane-is-vim}"`.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[ui]
# tmux: set -g mouse on
mouse_capture = true

show_agent_labels_on_pane_borders = false
[session]
# Replaces tmux-resurrect + tmux-continuum. The herdr server keeps panes
# running on its own; this restores agent panes into their native sessions.
resume_agents_on_restore = true

[experimental]
# tmux: set -g @resurrect-capture-pane-contents 'on'
pane_history = true

[ui.toast]
delivery = "herdr"
